name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Prepare signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            STORE_PASS="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
            KEY_PASS="$KEY_PASSWORD"
          else
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias inktrail \
              -storepass android \
              -keypass android \
              -dname "CN=InkTrail,O=InkTrail,C=CN"
            STORE_PASS="android"
            ALIAS="inktrail"
            KEY_PASS="android"
          fi
          {
            echo "store_file=$KEYSTORE_PATH"
            echo "store_password=$STORE_PASS"
            echo "key_alias=$ALIAS"
            echo "key_password=$KEY_PASS"
          } >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="${{ steps.signing.outputs.store_file }}" \
            -Pandroid.injected.signing.store.password="${{ steps.signing.outputs.store_password }}" \
            -Pandroid.injected.signing.key.alias="${{ steps.signing.outputs.key_alias }}" \
            -Pandroid.injected.signing.key.password="${{ steps.signing.outputs.key_password }}"

      - name: Package release artifacts
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          mkdir -p dist
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "Release APK not found at $APK_SRC"
            exit 1
          fi
          cp "$APK_SRC" "dist/InkTrail-${TAG}.apk"
          (cd dist && sha256sum "InkTrail-${TAG}.apk" > "InkTrail-${TAG}.apk.sha256")
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: InkTrail ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/InkTrail-*.apk
            dist/InkTrail-*.apk.sha256
